schemaVersion: 1
id: report-authoring
title: Report authoring
description: Fill validated structured report data. Do not submit, approve, or export a report.
capabilities:
  allowed:
    - report.context
    - report.read
    - report.gaps
    - report.update-master
    - report.update-data
documents:
  - id: policy
    path: policy.md
    title: Report authoring policy
    role: policy
    load: required
  - id: method
    path: method.md
    title: Evidence-led authoring method
    role: procedure
    load: required
  - id: recovery
    path: recovery.md
    title: Revision and receipt recovery
    role: procedure
    load: required
  - id: evidence
    path: evidence.md
    title: Evidence and uncertainty rules
    role: reference
    load: on-demand
  - id: precedent
    path: precedent.md
    title: Representative precedent
    role: precedent
    load: on-demand
knowledge:
  bootstrap: []
  available: []
completion:
  mode: user
  requiredCapabilities: []
