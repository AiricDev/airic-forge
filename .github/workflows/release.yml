name: Source release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git archive --format=tar.gz --prefix="airic-forge-${RELEASE_TAG}/" HEAD > "airic-forge-${RELEASE_TAG}.tar.gz"
          sha256sum "airic-forge-${RELEASE_TAG}.tar.gz" > SHA256SUMS
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --notes-file CHANGELOG.md \
            --title "AiricForge $RELEASE_TAG" \
            "airic-forge-${RELEASE_TAG}.tar.gz" SHA256SUMS
