services:
  airic-forge:
    image: ${FORGE_APP_IMAGE:?Set a pinned App-assembled Forge image}
    ports:
      - "127.0.0.1:4175:4175"
    environment:
      FORGE_PORT: "4175"
      FORGE_AGENT_CONFIG_DIR: /app/apps/api/agent
      FORGE_AGENT_CACHE_DIR: /data/agent-packages
      FORGE_PROJECT_DIR: /project
      FORGE_DATA_DIR: /data
      FORGE_WEB_DIST_DIR: /app/apps/workbench/public
      FORGE_APP_URL: ${FORGE_APP_URL:?Set the App origin}
      FORGE_APP_ID: ${FORGE_APP_ID:?Set the App identity}
      FORGE_APP_ADAPTER_MODULE: ${FORGE_APP_ADAPTER_MODULE:?Set the adapter path supplied by the App image}
      FORGE_ORGANIZATION_ID: ${FORGE_ORGANIZATION_ID:?Set FORGE_ORGANIZATION_ID}
      FORGE_ALLOWED_ORIGIN: ${FORGE_ALLOWED_ORIGIN:-http://localhost:5173}
      FORGE_PUBLIC_URL: ${FORGE_PUBLIC_URL:-http://127.0.0.1:4175}
      FORGE_MODEL_PROVIDER: ${FORGE_MODEL_PROVIDER:-}
      FORGE_MODEL_ID: ${FORGE_MODEL_ID:-}
      FORGE_MODEL_API_KEY: ${FORGE_MODEL_API_KEY:-}
      FORGE_MODEL_BASE_URL: ${FORGE_MODEL_BASE_URL:-}
    stop_grace_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - forge-project:/project
      - forge-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4175/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

volumes:
  forge-project:
  forge-data:
